name: release

# A release starts from a version tag pushed to the repository (git tag vX.Y.Z && git push origin vX.Y.Z), never
# from the GitHub web UI (plan 28 Task 1, ruling Q15). In order:
#   1. check-tag: the tag names the version the package carries (scripts/check_release.py);
#   2. tests (tests.yml) and the cross-platform determinism run (determinism.yml: the same figures on Linux, macOS
#      and Windows), both on the tagged commit;
#   3. build: the sdist and wheel, only when both pass;
#   4. publish: PyPI, by trusted publishing (no API token; opt in with the repository variable PUBLISH_PYPI = true
#      once pypi.org lists this repository as a trusted publisher for "foldmap": workflow release.yml, environment
#      pypi);
#   5. github-release: the GitHub release is created last, with the built files attached. Zenodo archives a release
#      (and mints its DOI) when one is published, so nothing is archived unless every gate above passed.
# RELEASING.md describes the steps.

on:
  push:
    tags: ["v*"]

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_release.py "$GITHUB_REF_NAME"

  tests:
    needs: check-tag
    uses: ./.github/workflows/tests.yml

  determinism:
    needs: check-tag
    uses: ./.github/workflows/determinism.yml

  build:
    needs: [tests, determinism]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # opt in once the PyPI trusted publisher exists: repository variable PUBLISH_PYPI = true
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, publish]
    # after the build, and after PyPI when that is on (publish skipped when PUBLISH_PYPI is not set; never failed)
    if: ${{ !cancelled() && needs.build.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.publish.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release (Zenodo archives it), the built files attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "foldmap $GITHUB_REF_NAME" --generate-notes
