name: release

# Publishes to PyPI when a GitHub release is published. Uses PyPI trusted publishing (no API token):
# on pypi.org, add this repository as a trusted publisher for the project "foldmap"
# (workflow: release.yml, environment: pypi) before the first release.
# Nothing is built or published unless the tests (tests.yml) and the cross-platform determinism run
# (determinism.yml: the same figures on Linux, macOS and Windows) both pass on the commit being released.

on:
  release:
    types: [published]

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_release.py "$GITHUB_REF_NAME"

  tests:
    needs: check-tag
    uses: ./.github/workflows/tests.yml

  determinism:
    needs: check-tag
    uses: ./.github/workflows/determinism.yml

  build:
    needs: [tests, determinism]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # opt in once the PyPI trusted publisher exists: repository variable PUBLISH_PYPI = true
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
