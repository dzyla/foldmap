name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install ".[test,app,mcp]"
      - run: python -m pytest -q

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist
      - name: Install from the unpacked sdist and run its own tests (no repository files)
        run: |
          mkdir ../sdist-check
          tar xzf dist/foldmap-*.tar.gz -C ../sdist-check --strip-components 1
          cd ../sdist-check
          pip install ".[test]"
          python -m pytest -q

  minimum-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "gemmi==0.7.0" "numpy==1.25.*" "scipy==1.10.*" "networkx==3.0" "matplotlib==3.11.*" "PyYAML==6.0.1" "threadpoolctl==3.1.0" pytest
      - run: pip install --no-deps .
      # The snapshots and the 8UUP layout test only agree with numpy 2.5 numerics (numpy 2.5 needs Python 3.12+); the other jobs run them
      - run: python -m pytest -q --ignore=tests/test_snapshots.py --deselect "tests/test_symmetry.py::test_symmetric_layout_repeats_the_protomer[8UUP]"
