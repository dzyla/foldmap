name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    env:
      PYTHONUTF8: ${{ matrix.os == 'windows-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Liberation Sans (the snapshot tests need it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation
      - run: pip install ".[test,app,mcp]"
      - run: python -m pytest -q

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Liberation Sans (the snapshot tests need it)
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation
      - run: pip install build
      - run: python -m build --sdist
      - name: Install from the unpacked sdist and run its own tests (no repository files)
        run: |
          mkdir ../sdist-check
          tar xzf dist/foldmap-*.tar.gz -C ../sdist-check --strip-components 1
          cd ../sdist-check
          pip install ".[test]"
          python -m pytest -q

  minimum-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Liberation Sans (the snapshot tests need it)
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation
      - run: pip install "gemmi==0.7.0" "numpy==1.24.*" "scipy==1.10.*" "networkx==3.0" "matplotlib==3.10.*" "PyYAML==6.0.1" pytest
      - run: pip install --no-deps .
      - run: python -m pytest -q
