[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "foldmap"
dynamic = ["version"]
description = "Publication-grade protein topology diagrams from PDB/mmCIF structures"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "CITATION.cff"]
requires-python = ">=3.11"
authors = [{ name = "Dawid Zyla" }]
keywords = ["protein", "topology", "structural biology", "secondary structure", "PDB", "mmCIF", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "gemmi>=0.7",
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.1",  # 3.0 has no simple_cycles on an undirected graph (science.pairing_cycle)
    "matplotlib>=3.10",  # 3.7-3.9 SVGs name only the resolved font (no fallback list): fails test_text_uses_a_journal_font
    "PyYAML>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/dzyla/foldmap"
Source = "https://github.com/dzyla/foldmap"
Issues = "https://github.com/dzyla/foldmap/issues"

[project.optional-dependencies]
test = ["pytest"]
dev = ["pytest", "ruff", "mcp>=2.2,<3", "streamlit>=1.65"]
app = ["streamlit>=1.65"]
mcp = ["mcp>=2.2,<3"]

[project.scripts]
foldmap = "foldmap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foldmap = ["assets/previews/*.png", "assets/*.svg", "assets/*.png"]

[tool.setuptools.dynamic]
version = { attr = "foldmap.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: takes tens of seconds (deselect with -m 'not slow')",
    "browser: drives the interactive page in Chromium via Playwright (skips when either is missing)",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = [
    "E741",  # `l` for loops and labels reads naturally here
    "B905",  # zip over equal-length element lists; strict= adds noise
]

[tool.ruff.lint.per-file-ignores]
"src/foldmap/interactive.py" = ["E501"]  # embedded HTML/CSS/JS
