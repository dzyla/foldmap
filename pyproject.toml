[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "foldmap"
version = "0.1.0"
description = "Publication-grade protein topology diagrams from PDB/mmCIF structures"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Dawid Zyla" }]
keywords = ["protein", "topology", "structural biology", "secondary structure", "PDB", "mmCIF", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["gemmi>=0.7", "numpy", "scipy", "networkx", "matplotlib", "PyYAML"]

[project.urls]
Homepage = "https://github.com/dzyla/foldmap"
Source = "https://github.com/dzyla/foldmap"
Issues = "https://github.com/dzyla/foldmap/issues"

[project.optional-dependencies]
test = ["pytest"]
dev = ["pytest", "ruff", "mcp>=2.2,<3", "streamlit>=1.40"]
app = ["streamlit>=1.40"]
mcp = ["mcp>=2.2,<3"]

[project.scripts]
foldmap = "foldmap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foldmap = ["assets/previews/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = [
    "E741",  # `l` for loops and labels reads naturally here
    "B905",  # zip over equal-length element lists; strict= adds noise
]

[tool.ruff.lint.per-file-ignores]
"src/foldmap/interactive.py" = ["E501"]  # embedded HTML/CSS/JS
