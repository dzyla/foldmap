[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foldmap"
version = "0.1.0"
description = "Publication-grade protein topology diagrams"
requires-python = ">=3.11"
dependencies = ["gemmi>=0.7", "numpy", "scipy", "networkx", "matplotlib", "PyYAML"]

[project.optional-dependencies]
test = ["pytest"]
app = ["streamlit>=1.40"]

[project.scripts]
foldmap = "foldmap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = [
    "E741",  # `l` for loops and labels reads naturally here
    "B905",  # zip over equal-length element lists; strict= adds noise
]

[tool.ruff.lint.per-file-ignores]
"src/foldmap/interactive.py" = ["E501"]  # embedded HTML/CSS/JS
